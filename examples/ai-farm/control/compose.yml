name: farm-control
x-api: &api
  build: ../api
  restart: unless-stopped
  environment: &api-env
    NODE_ENV: production
    PORT: "3000"
    DATABASE_URL: postgres://farm:${POSTGRES_PASSWORD:?Set hex DB password}@db:5432/farm
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set Admin password}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    INFERENCE_A_URL: ${INFERENCE_A_URL:?Set inference A LAN URL}
    INFERENCE_B_URL: ${INFERENCE_B_URL:?Set inference B LAN URL}
    INFERENCE_API_KEY: ${INFERENCE_API_KEY:?Set inference key}
    LOCAL_MODEL: corp-qwen
    ALLOW_CLOUD: ${ALLOW_CLOUD:-false}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_DB: farm
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set hex DB password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../api/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U farm -d farm"]
      interval: 5s
      timeout: 5s
      retries: 12
  api1:
    <<: *api
  api2:
    <<: *api
  gateway:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
volumes:
  postgres_data:
